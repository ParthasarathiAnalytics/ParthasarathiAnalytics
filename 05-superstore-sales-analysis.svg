<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="55%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="18" fill="url(#bg5)"/>

  <!-- shopping cart -->
  <g transform="translate(70,80)" fill="none" stroke="#FED7AA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 h14 l10 60 h64 l12 -42 h-80"/>
    <circle cx="34" cy="76" r="7" fill="#431407"/>
    <circle cx="78" cy="76" r="7" fill="#431407"/>
  </g>

  <!-- ascending sales bars with trend arrow -->
  <g transform="translate(430,150)">
    <rect x="0"   y="-20" width="26" height="20" rx="3" fill="#9A3412"/>
    <rect x="42"  y="-36" width="26" height="36" rx="3" fill="#C2410C"/>
    <rect x="84"  y="-52" width="26" height="52" rx="3" fill="#EA580C"/>
    <rect x="126" y="-70" width="26" height="70" rx="3" fill="#FB923C"/>
    <rect x="168" y="-90" width="26" height="90" rx="3" fill="#FDBA74"/>
    <path d="M0 -22 L42 -40 L84 -56 L126 -74 L168 -94" fill="none" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M158 -104 L172 -96 L168 -80" fill="none" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="40" y="200" font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700" fill="#FFEDD5">Superstore Sales Analysis</text>
  <rect x="40" y="30" width="46" height="4" rx="2" fill="#FDBA74"/>
</svg>
