<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="18" fill="url(#bg4)"/>

  <!-- currency motif -->
  <g transform="translate(110,110)">
    <circle r="58" fill="none" stroke="#C4B5FD" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="16" font-family="'Fira Code', 'Courier New', monospace" font-size="54" font-weight="700" fill="#E9D8FF" text-anchor="middle">$</text>
  </g>

  <!-- ascending salary-band bars -->
  <g transform="translate(430,150)">
    <rect x="0"   y="-24" width="24" height="24" rx="3" fill="#6D28D9"/>
    <rect x="40"  y="-40" width="24" height="40" rx="3" fill="#7C3AED"/>
    <rect x="80"  y="-56" width="24" height="56" rx="3" fill="#8B5CF6"/>
    <rect x="120" y="-72" width="24" height="72" rx="3" fill="#A78BFA"/>
    <rect x="160" y="-92" width="24" height="92" rx="3" fill="#C4B5FD"/>
    <line x1="-14" y1="0" x2="196" y2="0" stroke="#E9D8FF" stroke-width="1.4" opacity="0.5"/>
  </g>

  <text x="40" y="200" font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700" fill="#EDE9FE">Global Salary Survey Analysis</text>
  <rect x="40" y="30" width="46" height="4" rx="2" fill="#C4B5FD"/>
</svg>
