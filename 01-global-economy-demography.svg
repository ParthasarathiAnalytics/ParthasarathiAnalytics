<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081019"/>
      <stop offset="55%" stop-color="#0B4A5C"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="18" fill="url(#bg1)"/>

  <!-- globe -->
  <g transform="translate(110,110)" stroke="#67E8F9" stroke-width="1.6" fill="none" opacity="0.9">
    <circle r="58"/>
    <ellipse rx="22" ry="58"/>
    <ellipse rx="42" ry="58" opacity="0.7"/>
    <line x1="-58" y1="0" x2="58" y2="0"/>
    <path d="M -58 -22 Q 0 -34 58 -22" opacity="0.7"/>
    <path d="M -58 22 Q 0 34 58 22" opacity="0.7"/>
  </g>
  <circle cx="110" cy="110" r="58" fill="none" stroke="#22D3EE" stroke-width="2.5"/>

  <!-- country comparison bars + trend -->
  <g transform="translate(430,150)">
    <rect x="0"   y="-34" width="26" height="34" rx="3" fill="#155E75"/>
    <rect x="42"  y="-54" width="26" height="54" rx="3" fill="#0E7490"/>
    <rect x="84"  y="-40" width="26" height="40" rx="3" fill="#0891B2"/>
    <rect x="126" y="-72" width="26" height="72" rx="3" fill="#22D3EE"/>
    <rect x="168" y="-58" width="26" height="58" rx="3" fill="#67E8F9"/>
    <polyline points="13,-40 55,-60 97,-46 139,-78 181,-64" fill="none" stroke="#F0FDFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="13" cy="-40" r="3.5" fill="#F0FDFF"/>
    <circle cx="55" cy="-60" r="3.5" fill="#F0FDFF"/>
    <circle cx="97" cy="-46" r="3.5" fill="#F0FDFF"/>
    <circle cx="139" cy="-78" r="3.5" fill="#F0FDFF"/>
    <circle cx="181" cy="-64" r="3.5" fill="#F0FDFF"/>
  </g>

  <text x="40" y="200" font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700" fill="#F0FDFF">Global Economy &amp; Demography</text>
  <rect x="40" y="30" width="46" height="4" rx="2" fill="#22D3EE"/>
</svg>
