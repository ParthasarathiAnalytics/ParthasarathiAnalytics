<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052E1C"/>
      <stop offset="55%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="18" fill="url(#bg3)"/>

  <!-- pitch stripes -->
  <g opacity="0.18">
    <rect x="0"   y="0" width="800" height="220" fill="none"/>
    <rect x="0" y="0" width="50" height="220" fill="#EAB308"/>
    <rect x="150" y="0" width="50" height="220" fill="#EAB308"/>
    <rect x="300" y="0" width="50" height="220" fill="#EAB308"/>
    <rect x="450" y="0" width="50" height="220" fill="#EAB308"/>
    <rect x="600" y="0" width="50" height="220" fill="#EAB308"/>
    <rect x="750" y="0" width="50" height="220" fill="#EAB308"/>
  </g>

  <!-- bat + ball (generic, no team markings) -->
  <g transform="translate(100,120) rotate(-18)" fill="none" stroke="#FEF9C3" stroke-width="3" stroke-linecap="round">
    <path d="M-10 40 L-4 -40 Q0 -52 10 -40 L16 40 Q3 52 -10 40 Z" fill="#8B5E34" stroke="#FEF9C3" stroke-width="2"/>
    <line x1="3" y1="40" x2="3" y2="70" stroke="#FEF9C3" stroke-width="6"/>
  </g>
  <circle cx="185" cy="150" r="11" fill="#EAB308" stroke="#FEF9C3" stroke-width="1.5"/>

  <!-- generic trophy silhouette -->
  <g transform="translate(700,58)" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round">
    <path d="M-16 0 q0 22 16 22 q16 0 16 -22 z"/>
    <path d="M-16 4 q-14 0 -14 -14 q0 -8 10 -8" />
    <path d="M16 4 q14 0 14 -14 q0 -8 -10 -8" />
    <line x1="0" y1="22" x2="0" y2="34"/>
    <line x1="-12" y1="34" x2="12" y2="34"/>
  </g>

  <!-- rising prediction probability curve -->
  <g transform="translate(420,168)">
    <line x1="0" y1="0" x2="230" y2="0" stroke="#DCFCE7" stroke-width="1.4" opacity="0.45"/>
    <path d="M0 0 Q 60 -4 110 -40 T 230 -108" fill="none" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
    <circle cx="230" cy="-108" r="5" fill="#FEF9C3"/>
  </g>

  <text x="40" y="200" font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700" fill="#FEF9C3">IPL Winner Prediction</text>
  <rect x="40" y="30" width="46" height="4" rx="2" fill="#EAB308"/>
</svg>
