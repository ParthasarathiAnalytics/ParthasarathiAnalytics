    <path d="M80 30 q28 -4 28 18 q0 22 -28 18" />
    <path d="M18 -6 q6 12 0 18 M38 -10 q6 14 0 20 M58 -6 q6 12 0 18" stroke-width="2.4" opacity="0.85"/>
  </g>

  <!-- scatter plot -->
  <g transform="translate(440,150)">
    <line x1="0" y1="0" x2="210" y2="0" stroke="#E8C39E" stroke-width="1.4" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#E8C39E" stroke-width="1.4" opacity="0.5"/>
    <circle cx="20"  cy="-18" r="5" fill="#E8C39E" opacity="0.9"/>
    <circle cx="48"  cy="-42" r="8" fill="#D9A066" opacity="0.9"/>
    <circle cx="80"  cy="-30" r="4" fill="#E8C39E" opacity="0.8"/>
    <circle cx="112" cy="-60" r="7" fill="#D9A066" opacity="0.9"/>
    <circle cx="140" cy="-48" r="5" fill="#E8C39E" opacity="0.85"/>
    <circle cx="168" cy="-78" r="9" fill="#F3D9B8" opacity="0.95"/>
    <circle cx="192" cy="-58" r="4" fill="#E8C39E" opacity="0.8"/>
  </g>

  <text x="40" y="200" font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700" fill="#F3D9B8">Coffee Data Analysis</text>
  <rect x="40" y="30" width="46" height="4" rx="2" fill="#D9A066"/>
